name: Build and Release
on:
  push:
    tags: ['v[0-9]*']
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish/rebuild
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Fetch pinned geodata for real-core route tests
        run: |
          bash scripts/fetch-geodata.sh "$RUNNER_TEMP/geodata"
          echo "PPNODE_TEST_GEODATA=$RUNNER_TEMP/geodata" >> "$GITHUB_ENV"
      - name: Installer helpers and node contract/data-plane tests
        run: |
          bash scripts/test-release.sh
          go test -race -timeout 10m ./api/panel ./core/outbound ./core/inbound ./core/streamguard ./core/app/dispatcher ./core ./node ./cmd ./limiter ./common/task ./common/logx -count=1

  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - id: meta
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          sha=$(git rev-parse HEAD)
          test "$(git rev-list -n 1 "$TAG")" = "$sha"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          prerelease=false
          [[ $TAG != *-* ]] || prerelease=true
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . .github/build/release-targets.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch immutable checked geodata once for this release
        run: bash scripts/fetch-geodata.sh geodata
      - uses: actions/upload-artifact@v4
        with:
          name: release-geodata
          path: geodata/*
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/download-artifact@v4
        with:
          name: release-geodata
          path: geodata
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GEODATA_DIR: geodata
        run: bash scripts/release-build.sh '${{ matrix.goos }}' '${{ matrix.goarch }}' '${{ matrix.goarm }}' '${{ matrix.gomips }}'
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.id }}
          path: output/release/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: output/release
      - name: Publish archives, management scripts, template and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/ppnode.sh scripts/update.sh output/release/
          cp conf/config.yml.example output/release/config.yml
          cd output/release
          sha256sum -- *.zip install.sh ppnode.sh update.sh config.yml > SHA256SUMS
          sha256sum -c SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" ./*.zip install.sh ppnode.sh update.sh config.yml SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"
