name: Node CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Fetch pinned production geodata for route tests
        run: |
          bash scripts/fetch-geodata.sh "$RUNNER_TEMP/geodata"
          echo "PPNODE_TEST_GEODATA=$RUNNER_TEMP/geodata" >> "$GITHUB_ENV"
      - name: Release helpers and workflow/action syntax tests
        run: bash scripts/test-release.sh
      - name: Focused route, wire and core race tests
        run: go test -race -timeout 10m ./api/panel ./core/outbound ./core/inbound ./core/streamguard ./core/app/dispatcher ./core ./node ./cmd ./limiter ./common/task ./common/logx -count=1
      - name: Full node tests
        run: go test -timeout 10m ./... -count=1
      - name: Static production compile
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/ppanel-node .
